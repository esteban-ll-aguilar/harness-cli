name: Harness Guardian CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  guardian:
    name: 🛡️ Guardian Gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Validate Specs Exist (SDD)
        run: |
          if [ -d ".harness/specs" ]; then
            for spec in .harness/specs/*/; do
              for required in spec.md plan.md tasks.md; do
                if [ ! -f "$spec/$required" ]; then
                  echo "❌ Missing $required in $spec"
                  exit 1
                fi
              done
              if [ ! -d "$spec/features" ] || [ -z "$(ls $spec/features/*.feature 2>/dev/null)" ]; then
                echo "❌ Missing BDD .feature files in $spec"
                exit 1
              fi
            done
          fi
          echo "✅ All specs validated"

      - name: Unified release gate
        run: npm run release:check
