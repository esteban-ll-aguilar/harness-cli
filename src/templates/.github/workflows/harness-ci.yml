name: Harness Guardian CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  guardian:
    name: 🛡️ Guardian Gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Validate Specs Exist (SDD)
        run: |
          if [ -d ".harness/specs" ]; then
            for spec in .harness/specs/*/; do
              for required in spec.md plan.md tasks.md; do
                if [ ! -f "$spec/$required" ]; then
                  echo "❌ Missing $required in $spec"
                  exit 1
                fi
              done
              if [ ! -d "$spec/features" ] || [ -z "$(ls $spec/features/*.feature 2>/dev/null)" ]; then
                echo "❌ Missing BDD .feature files in $spec"
                exit 1
              fi
            done
          fi
          echo "✅ All specs validated"

      - name: Harness CLI smoke test
        run: |
          node bin/harness.js --version
          node bin/harness.js help
          node bin/harness-mcp.js </dev/null || test $? -eq 0

      - name: Run Project Tests (from .harnessrc)
        run: |
          RUNNER=$(node -e "try { const rc=require('./.harnessrc'); process.stdout.write(rc.language?.runner || ''); } catch(e) { process.stdout.write(''); }")
          if [ -n "$RUNNER" ] && [ "$RUNNER" != "npm test" ]; then
            echo "Running: $RUNNER"
            eval "$RUNNER"
          elif [ -f "package.json" ]; then
            echo "Detected package.json — running npm test"
            npm test
          else
            echo "No test runner detected in .harnessrc — skipping (configure rc.language.runner)"
          fi
        continue-on-error: false

      - name: Security Audit
        run: npm audit --audit-level=moderate

      - name: Package is publishable
        run: npm pack --dry-run
