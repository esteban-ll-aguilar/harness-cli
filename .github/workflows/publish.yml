name: Publish

# Auto-publishes a new patch version to npm on every merge to main.
# Uses npm Trusted Publishing (OIDC) — NO npm token stored as a secret.
#
# One-time setup on npmjs.com (package page → Settings → Trusted Publishers):
#   Publisher:             GitHub Actions
#   Organization or user:  esteban-ll-aguilar
#   Repository:            harness-cli
#   Workflow filename:     publish.yml
#   Environment name:      (leave empty)
#   Allowed actions:       include read/write (publish) permissions
#   Publishing access:     "Require two-factor authentication and disallow
#                          bypass 2fa tokens" (recommended)
#
# The version-bump commit includes "[skip-ci]" so this workflow does not
# re-trigger itself in a loop.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    if: "!contains(github.event.head_commit.message, '[skip-ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pushes the version bump + tag back to main
      id-token: write   # requests the OIDC token npm uses to authenticate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check npm version (Trusted Publishing needs >= 11.5.1)
        run: |
          npm --version
          test "$(npm --version | cut -d. -f1)" -ge 11

      - name: Run tests
        run: npm test

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        run: |
          npm version patch -m "chore(release): v%s [skip-ci]"

      - name: Publish to npm (Trusted Publishing, no token)
        run: npm publish --provenance --access public

      - name: Push version bump and tag
        run: git push --follow-tags
