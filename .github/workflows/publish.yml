name: Publish

# Automatically bumps and stages a new patch version on every merge to main.
# Uses npm Trusted Publishing (OIDC) — NO npm token stored as a secret.
#
# One-time setup on npmjs.com (package page → Settings → Trusted Publishers):
#   Publisher:             GitHub Actions
#   Organization or user:  esteban-ll-aguilar
#   Repository:            harness-cli
#   Workflow filename:     publish.yml
#   Environment name:      (leave empty)
#   Allowed actions:       include read/write (publish) permissions
#   Publishing access:     "Require two-factor authentication and disallow
#                          bypass 2fa tokens" (recommended)
#
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    env:
      HARNESS_SKIP_MODEL_DOWNLOAD: '1'
    if: "!contains(github.event.head_commit.message, '[skip-ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pushes the version bump + tag back to main
      id-token: write   # requests the OIDC token npm uses to authenticate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Upgrade npm (OIDC exchange needs >= 11.5.1; Node 24 bundles older)
        run: npm install -g npm@latest

      - name: Check npm version (Trusted Publishing needs >= 11.5.1)
        run: |
          npm --version
          node -e "const v=require('child_process').execSync('npm --version').toString().trim().split('.').map(Number); const [a,b,c]=v; process.exit((a<11||(a===11&&(b<5||(b===5&&c<1))))?1:0);"

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        run: |
          npm version patch -m "chore(release): v%s [skip-ci]"

      - name: Stage package to npm (Trusted Publishing, manual approval required)
        # The npm Trusted Publisher is configured without direct npm publish.
        # A maintainer reviews and approves the staged package with 2FA.
        run: npm stage publish --access public --loglevel=verbose

      - name: Push version bump and tag
        run: git push --follow-tags
